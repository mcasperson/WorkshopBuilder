[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:octoaispacebuilder]
command=/usr/local/bin/octoaispacebuilder
environment=SPACEBUILDER_INSTALLATION_DIRECTORY="/opt/spacebuilder/functions"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octoaispacebuilder.log
stderr_logfile=/var/log/supervisor/octoaispacebuilder.err.log

[program:fakeapps]
command=/usr/local/bin/fakeapps
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/fakeapps.log
stderr_logfile=/var/log/supervisor/fakeapps.err.log

[program:azurite]
command=/usr/local/bin/node /opt/azurite/node_modules/azurite/dist/src/azurite.js --location /var/lib/azurite --skipApiVersionCheck --blobHost 127.0.0.1 --queueHost 127.0.0.1 --tableHost 127.0.0.1
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/azurite.log
stderr_logfile=/var/log/supervisor/azurite.err.log
