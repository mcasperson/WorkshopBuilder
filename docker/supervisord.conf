[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:octoaispacebuilder]
command=/usr/local/bin/octoaispacebuilder
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/octoaispacebuilder.log
stderr_logfile=/var/log/supervisor/octoaispacebuilder.err.log

[program:fakeapps]
command=/usr/local/bin/fakeapps
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/fakeapps.log
stderr_logfile=/var/log/supervisor/fakeapps.err.log
