name: Build and publish Docker image

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone OctopusCopilot
        uses: actions/checkout@v4
        with:
          repository: mcasperson/OctopusCopilot
          path: OctopusCopilot

      - name: Clone OctoAISpaceBuilder
        uses: actions/checkout@v4
        with:
          repository: mcasperson/OctoAISpaceBuilder
          path: OctoAISpaceBuilder

      - name: Clone octopus-argocd-gateway
        uses: actions/checkout@v4
        with:
          repository: OctopusDeploy/octopus-argocd-gateway
          ref: mattc/mockedargo2
          path: octopus-argocd-gateway

      - name: Set up Go for OctoAISpaceBuilder
        uses: actions/setup-go@v5
        with:
          go-version-file: OctoAISpaceBuilder/go.mod
          cache-dependency-path: OctoAISpaceBuilder/go.sum

      - name: Build OctoAISpaceBuilder
        working-directory: OctoAISpaceBuilder
        run: go build -o ../bin/octoaispacebuilder cmd/web/main.go
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Set up Go for octopus-argocd-gateway
        uses: actions/setup-go@v5
        with:
          go-version-file: octopus-argocd-gateway/go.mod
          cache-dependency-path: octopus-argocd-gateway/go.sum

      - name: Build octopus-argocd-gateway fakeapps
        working-directory: octopus-argocd-gateway
        run: go build -o ../bin/fakeapps ./cmd/fakeapps
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
